name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# The job only reads the checkout; public PRs from forks must not get a write token.
permissions:
  contents: read

jobs:
  build:
    name: build (incl. internal link validation), audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # `astro build` runs starlight-links-validator: a broken internal link fails the build.
      - run: npm run build
      - name: Site produced
        run: test -f dist/index.html && test -f dist/validators/run-a-node/index.html && echo "docs built"
      - run: npm audit --audit-level=high
